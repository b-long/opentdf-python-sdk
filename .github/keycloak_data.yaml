# Vendored from
# https://raw.githubusercontent.com/opentdf/platform/service/<PLATFORM_VERSION>/service/cmd/keycloak_data.yaml
# (see PLATFORM_VERSION in docker-compose.platform.env) with one change:
# `directAccessGrantsEnabled: true` added to the "opentdf" client, which our
# integration tests need for the OAuth2 password grant
# (see tests/integration/support_sdk.py::get_user_access_token).
#
# This is a static file, so if PLATFORM_VERSION is ever bumped, re-fetch it
# from the URL above (with that version substituted in) and re-apply the
# change above -- the realm schema here is not compatible with newer
# platform releases (see issue #26).
baseUrl: &baseUrl http://localhost:8888
serverBaseUrl: &serverBaseUrl http://localhost:8080
customAudMapper: &customAudMapper
  name: audience-mapper
  protocol: openid-connect
  protocolMapper: oidc-audience-mapper
  config:
    included.custom.audience: *serverBaseUrl
    access.token.claim: "true"
    id.token.claim: "true"
realms:
  - realm_repepresentation:
      realm: opentdf
      enabled: true
    custom_realm_roles:
      - name: opentdf-admin
      - name: opentdf-standard
    custom_client_roles:
      tdf-entity-resolution:
        - name: entity-resolution-test-role
    custom_groups:
      - name: mygroup
        attributes:
          mygroupattribute:
            - mygroupvalue
    clients:
      - client:
          clientID: opentdf
          enabled: true
          name: opentdf
          serviceAccountsEnabled: true
          clientAuthenticatorType: client-secret
          secret: secret
          protocolMappers:
            - *customAudMapper
          directAccessGrantsEnabled: true
        sa_realm_roles:
          - opentdf-admin
        copies: 10
      - client:
          clientID: opentdf-sdk
          enabled: true
          name: opentdf-sdk
          serviceAccountsEnabled: true
          clientAuthenticatorType: client-secret
          secret: secret
          protocolMappers:
            - *customAudMapper
        sa_realm_roles:
          - opentdf-standard
      - client:
          clientID: tdf-entity-resolution
          enabled: true
          name: tdf-entity-resolution
          serviceAccountsEnabled: true
          clientAuthenticatorType: client-secret
          secret: secret
          protocolMappers:
            - *customAudMapper
        sa_client_roles:
          realm-management:
            - view-clients
            - query-clients
            - view-users
            - query-users
      - client:
          clientID: tdf-authorization-svc
          enabled: true
          name: tdf-authorization-svc
          serviceAccountsEnabled: true
          clientAuthenticatorType: client-secret
          secret: secret
          protocolMappers:
            - *customAudMapper
      - client:
          clientID: cli-client
          enabled: true
          name: cli-client
          serviceAccountsEnabled: false
          publicClient: true
          redirectUris:
            - 'http://localhost:*'
          protocolMappers:
            - *customAudMapper
    users:
      - username: sample-user
        enabled: true
        firstName: sample
        lastName: user
        email: sampleuser@sample.com
        credentials:
          - value: testuser123
            type: password
        attributes:
          superhero_name:
            - thor
          superhero_group:
            - avengers
        groups:
          - mygroup
        realmRoles:
          - opentdf-admin
        clientRoles:
          realm-management:
            - view-clients
            - query-clients
            - view-users
            - query-users
          tdf-entity-resolution:
            - entity-resolution-test-role
        copies: 10
    token_exchanges:
      - start_client: opentdf
        target_client: opentdf-sdk

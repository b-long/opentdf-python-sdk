# Runs the OpenTDF platform locally via `docker compose`, following
#   https://opentdf.io/getting-started#getting-the-platform-running
# instead of building the platform from source (see issue #26).
#
# docker-compose.platform.yaml is a vendored copy of the quickstart's
# docker-compose.yaml. docker-compose.platform.override.yaml and
# keycloak_data.yaml carry the local changes needed to make it usable here
# -- see the comments in those files for why each one is needed.
name: "NEW: Platform Integration testing"

on:
  workflow_call:
    inputs:
      wheel:
        required: true
        type: string
      python_version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  integration_test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout this repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Update /etc/hosts
        shell: bash
        run: |
          echo -e "127.0.0.1 platform.opentdf.local\n127.0.0.1 keycloak.opentdf.local" | sudo tee -a /etc/hosts

      - name: Bring the platform up
        shell: bash
        run: |
          docker compose \
            --file .github/docker-compose.platform.yaml \
            --file .github/docker-compose.platform.override.yaml \
            up -d --wait --wait-timeout 360

      - name: Set up go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.24.x"
          check-latest: false

      - name: Get grpcurl
        shell: bash
        run: go install github.com/fullstorydev/grpcurl/cmd/grpcurl@v1.8.9

      - name: Make sure that the platform is up
        shell: bash
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          grpcurl -plaintext localhost:8080 list && \
          grpcurl -plaintext localhost:8080 kas.AccessService/PublicKey

      - name: Install otdfctl
        run: go install github.com/opentdf/otdfctl@v0.28.0
        shell: bash

      - name: Create creds.json for otdfctl
        run: echo -n '{"clientId":"opentdf-sdk","clientSecret":"secret"}' > creds.json
        shell: bash

      - name: Create a plaintext file
        run: echo "integration test secret" > secret.txt
        shell: bash

      - name: Encrypt file with otdfctl (no attributes)
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          otdfctl encrypt -o secret.txt.tdf --host http://localhost:8080 --with-client-creds-file creds.json secret.txt
        shell: bash

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ inputs.python_version }}

      - name: Run all tests, minus integration tests
        env:
          OPENTDF_CLIENT_ID: "opentdf"
          OPENTDF_CLIENT_SECRET: "secret"
          OPENTDF_HOSTNAME: "localhost:8080"
          OIDC_TOKEN_ENDPOINT: "http://keycloak.opentdf.local:8888/auth/realms/opentdf/protocol/openid-connect/token"
          OPENTDF_KAS_URL: "http://localhost:8080/kas"
          INSECURE_SKIP_VERIFY: "TRUE"
          TEST_OPENTDF_ATTRIBUTE_1: "https://example.net/attr/attr1/value/value1"
          TEST_OPENTDF_ATTRIBUTE_2: "https://example.com/attr/attr1/value/value1"
        run: |
          uv sync
          # Skip the tests marked "integration"
          uv run pytest -m "not integration" --tb=short -vv tests
        shell: bash

      - name: Run integration tests
        env:
          OPENTDF_CLIENT_ID: "opentdf"
          OPENTDF_CLIENT_SECRET: "secret"
          OPENTDF_PLATFORM_HOST: "localhost:8080"
          OPENTDF_PLATFORM_URL: "http://localhost:8080"
          OPENTDF_KEYCLOAK_HOST: "keycloak.opentdf.local:8888"
          OIDC_OP_TOKEN_ENDPOINT: "http://keycloak.opentdf.local:8888/auth/realms/opentdf/protocol/openid-connect/token"
          OPENTDF_KAS_URL: "http://localhost:8080/kas"
          INSECURE_SKIP_VERIFY: "TRUE"
          TEST_OPENTDF_ATTRIBUTE_1: "https://example.net/attr/attr1/value/value1"
          TEST_OPENTDF_ATTRIBUTE_2: "https://example.com/attr/attr1/value/value1"
        run: |
          # Run check_entitlements.sh
          ./.github/check_entitlements.sh

          uv sync
          # Skip the tests marked "integration"
          uv run pytest -m "integration" --tb=short -vv tests
        shell: bash


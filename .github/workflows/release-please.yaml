name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  # Run full test suite before any release operations
  test-suite:
    permissions:
      contents: read
    uses: $/.github/workflows/test-suite.yaml

  release-please:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    needs: test-suite
    if: needs.test-suite.outputs.tests_passed == 'true'
    outputs:
      releases_created: ${{ steps.release-main.outputs.releases_created }}
      paths_released: ${{ steps.release-main.outputs.paths_released }}
      tag_name: ${{ steps.release-main.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Release-please for main branch (creates stable releases)
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release-main
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          token: ${{ secrets.GITHUB_TOKEN }}

  # Publish packages only when releases are actually created by release-please
  publish:
    permissions:
      contents: write
      # This permission is mandatory for PyPI's trusted publishing
      id-token: write
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      # Build the release tag, not the commit that triggered this run
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest"
          enable-cache: false

      - name: Build package
        shell: bash
        run: |
          uv build --package otdf-python

      - name: Test import
        shell: bash
        run: |
          uv run python -c 'import otdf_python; print("Package imported successfully")'

      # Publish with "trusted publisher" mechanism:
      # https://docs.pypi.org/trusted-publishers/
      #
      # Requires GHA token permission (above in YAML) and PyPI management:
      #   https://pypi.org/manage/project/otdf-python/settings/publishing/
      - name: Publish package distributions to PyPI
        if: github.ref == 'refs/heads/main'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # repository-url: https://pypi.org/legacy/
          packages-dir: dist/
          verbose: true

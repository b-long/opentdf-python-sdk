name: Lint PR Title

on:
  # pull_request_target is required so that PRs from forks can be linted.
  # This is safe here: the workflow never checks out or runs PR code, and
  # the token is limited to `pull-requests: read`.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Types must match changelog-sections in .release-please-config.json
          types: |
            feat
            fix
            perf
            revert
            docs
            refactor
            build
            style
            chore
            test
            ci
          requireScope: false

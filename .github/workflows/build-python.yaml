# Build otdf-python wheel using uv and output the wheel path for downstream workflows
name: "Build Python Wheel"
on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    outputs:
      wheel: ${{ steps.find_wheel.outputs.wheel_path }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Build otdf-python wheel using uv
        run: |
          uv sync --frozen
          uv build --wheel --package otdf-python
        shell: bash

      - name: Check wheel with twine
        run: uvx twine check dist/*
        shell: bash

      - name: Find built wheel
        id: find_wheel
        run: |
          wheel_path=$(ls dist/*.whl | head -n1)
          echo "wheel_path=$wheel_path" >> $GITHUB_OUTPUT
        shell: bash

      # - name: Upload wheel as artifact
      #   uses: actions/upload-artifact@v4
